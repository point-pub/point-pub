{% extends "base.html" %}

{% block title %}صناعة المواقع - POINT PUB{% endblock %}

{% block content %}
<section class="service-page">
    <h1>صناعة المواقع</h1>
    <p class="subtitle">تصميم وبرمجة مواقع احترافية</p>

    <div class="service-gallery">
        {% if images %}
            {% for image in images %}
                <a href="{{ url_for('static', filename='images/services/websites/' + image) }}" class="gallery-item">
                    <img src="{{ url_for('static', filename='images/services/websites/' + image) }}" alt="صورة من أعمالنا" loading="lazy">
                </a>
            {% endfor %}
        {% else %}
            <p style="text-align:center; width:100%; color:var(--gray);">لا توجد صور مضافة حالياً.</p>
        {% endif %}
    </div>

    <div class="service-cta">
        <a href="https://wa.me/213793432883?text=أريد عرض سعر لموقع إلكتروني" class="btn-whatsapp" target="_blank">
            طلب السعر عبر واتساب
        </a>
    </div>
</section>
{% endblock %}
