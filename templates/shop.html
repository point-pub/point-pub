{% extends "base.html" %}

{% block title %}المتجر - POINT PUB{% endblock %}

{% block content %}
<section class="shop-section">
    <h1>المتجر</h1>
    <p class="subtitle">اكتشف منتجاتنا المميزة</p>

    <form method="GET" class="filters-form">
        <input type="text" name="search" placeholder="ابحث عن منتج..." value="{{ search }}">
        <input type="number" name="min_price" placeholder="أدنى سعر" value="{{ min_price or '' }}">
        <input type="number" name="max_price" placeholder="أقصى سعر" value="{{ max_price or '' }}">
        <select name="category">
            <option value="">جميع الفئات</option>
            {% for cat in categories %}
                {% if cat[0] %}
                <option value="{{ cat[0] }}" {% if category == cat[0] %}selected{% endif %}>{{ cat[0] }}</option>
                {% endif %}
            {% endfor %}
        </select>
        <button type="submit" class="btn-primary">بحث</button>
    </form>

    <div class="products-grid">
        {% for product in products %}
        <div class="product-card">
            <img src="{{ product.image if product.image and product.image.startswith('http') else url_for('static', filename='images/products/' + product.image) if product.image else 'https://via.placeholder.com/300x300/0a1929/f5c842?text=POINT+PUB' }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="product-price">{{ product.price }} دج</p>
            <div class="product-actions">
                <a href="{{ url_for('product_detail', id=product.id) }}" class="btn-outline">التفاصيل</a>
                <a href="{{ url_for('add_to_cart', id=product.id) }}" class="btn-primary">أضف</a>
            </div>
        </div>
        {% else %}
        <p class="no-products">لا توجد منتجات حالياً</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
