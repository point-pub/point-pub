{% extends "base.html" %}

{% block title %}إتمام الطلب{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<style>
    .ts-wrapper .ts-control {
        background-color: var(--dark-card);
        border: 1px solid var(--dark-border);
        color: var(--white);
        border-radius: 12px;
        padding: 10px 15px;
    }
    .ts-wrapper .ts-dropdown {
        background-color: var(--dark-card);
        border: 1px solid var(--dark-border);
        color: var(--white);
    }
    .ts-wrapper .ts-dropdown .option { color: var(--gray); }
    .ts-wrapper .ts-dropdown .option.active { background-color: var(--dark-border); color: var(--white); }
    .ts-wrapper .ts-control input { color: var(--white) !important; }
    
    .coupon-message {
        margin-top: 0.5rem;
        font-weight: bold;
        font-size: 1rem;
        display: none;
    }
    .coupon-success { color: var(--success); }
    .coupon-error { color: var(--danger); }
</style>
{% endblock %}

{% block content %}
<section class="checkout-section">
    <h1>إتمام الطلب</h1>

    <form method="POST" class="checkout-form" id="checkoutForm">
        <h2>معلومات التوصيل</h2>
        <input type="text" name="name" placeholder="الاسم الكامل" required>
        <input type="text" name="phone" placeholder="رقم الهاتف" required>
        <textarea name="address" placeholder="العنوان بالتفصيل (الشارع، الحي...)" required></textarea>

        <label style="color: var(--gold);">الولاية:</label>
        <select id="wilaya_select" name="wilaya" placeholder="ابحث عن الولاية..." required>
            <option value="">جاري تحميل الولايات...</option>
        </select>

        <label style="color: var(--gold);">البلدية:</label>
        <select id="daira_select" name="daira" placeholder="اختر الولاية أولاً..." required>
            <option value="">اختر الولاية أولاً</option>
        </select>

        <h2>طريقة التوصيل</h2>
        <select name="delivery_type" required>
            <option value="home">توصيل إلى المنزل</option>
            <option value="office">توصيل إلى المكتب</option>
        </select>

        <textarea name="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>

        <h2>كود الخصم / المسوق</h2>
        <input type="text" name="coupon" id="coupon_input" placeholder="كود الخصم (اختياري)">
        
        <!-- رسالة نجاح أو خطأ الكوبون -->
        <div id="coupon_message" class="coupon-message"></div>
        
        <!-- حقل مخفي للسعر الإجمالي -->
        <input type="hidden" id="cart_total_input" value="{{ total }}">
        
        <div style="margin-top: 0.5rem; color: var(--gray); font-size: 1.1rem;">
            الإجمالي الحالي: <span id="display_total" style="color: var(--gold); font-weight: bold;">{{ total }}</span> دج
        </div>

        <input type="text" name="marketer_code" placeholder="كود المسوق (اختياري)" style="margin-top: 1rem;">

        <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">تأكيد الطلب</button>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // ===== منطق الولايات والبلديات =====
    const wilayasUrl = "https://raw.githubusercontent.com/el-amin-dev/algeria-wilayas-communes/main/data/wilayas.json";
    const communesUrl = "https://raw.githubusercontent.com/el-amin-dev/algeria-wilayas-communes/main/data/communes.json";
    let allCommunes = [];
    let tsWilaya, tsDaira;

    Promise.all([
        fetch(wilayasUrl).then(res => res.json()),
        fetch(communesUrl).then(res => res.json())
    ]).then(([wilayasData, communesData]) => {
        const wilayas = wilayasData.wilayas || wilayasData;
        allCommunes = communesData.communes || communesData;

        const wilayaSelect = document.getElementById('wilaya_select');
        wilayaSelect.innerHTML = '<option value="">اختر الولاية...</option>';

        wilayas.forEach(w => {
            const option = document.createElement('option');
            option.value = w.code || w.nom_ar; 
            option.textContent = `${w.code} - ${w.nom_ar}`; 
            option.dataset.nameAr = w.nom_ar;
            wilayaSelect.appendChild(option);
        });

        tsWilaya = new TomSelect("#wilaya_select", {
            create: false,
            maxOptions: null, 
            sortField: { field: "text", direction: "asc" },
            onChange: function(value) {
                const selectedOption = wilayaSelect.querySelector(`option[value="${value}"]`);
                if (!selectedOption) return;
                
                const wilayaNameAr = selectedOption.dataset.nameAr;
                const filteredCommunes = allCommunes.filter(c => {
                    return (c.wilaya_name && c.wilaya_name === wilayaNameAr) || 
                           (c.wilaya_code && c.wilaya_code == value);
                });

                tsDaira.clearOptions();
                tsDaira.addOption({ value: "", text: "اختر البلدية..." });

                if (filteredCommunes.length === 0) {
                    tsDaira.addOption({ value: "غير محددة", text: "لا توجد بلديات مسجلة لهذه الولاية" });
                } else {
                    filteredCommunes.forEach(c => {
                        tsDaira.addOption({ value: c.nom_ar || c.name_ar, text: c.nom_ar || c.name_ar });
                    });
                }
                tsDaira.refreshOptions(false);
            }
        });

        tsDaira = new TomSelect("#daira_select", {
            create: false,
            maxOptions: null,
            sortField: { field: "text", direction: "asc" }
        });
    }).catch(error => console.error("خطأ في تحميل البيانات:", error));

    // ===== منطق التحقق المباشر من الكوبون =====
    const couponInput = document.getElementById('coupon_input');
    const couponMessage = document.getElementById('coupon_message');
    const totalInput = document.getElementById('cart_total_input');
    const displayTotal = document.getElementById('display_total');

    let debounceTimer;

    couponInput.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const code = this.value.trim();
        const total = parseFloat(totalInput.value) || 0;

        if (!code) {
            couponMessage.style.display = 'none';
            displayTotal.textContent = total;
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch('/api/check-coupon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, total: total })
            })
            .then(res => res.json())
            .then(data => {
                couponMessage.style.display = 'block';
                if (data.valid) {
                    couponMessage.className = 'coupon-message coupon-success';
                    couponMessage.textContent = `تم تطبيق الخصم! (${data.discount_percent}%) - وفرت ${data.discount_amount} دج`;
                    displayTotal.textContent = data.new_total;
                } else {
                    couponMessage.className = 'coupon-message coupon-error';
                    couponMessage.textContent = data.message;
                    displayTotal.textContent = total;
                }
            })
            .catch(err => console.error('خطأ في الاتصال:', err));
        }, 600);
    });
});
</script>
{% endblock %}
